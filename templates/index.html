<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World in Live</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            background: #007BFF;
            color: white;
            margin: 0;
        }


        .categories {
            display: flex;
            justify-content: space between;
            align-items: stretch;
            gap: 16px;
            margin: 20px 0;
            width: auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .category-box {
            flex: 1 1 0;
            min-width: 140px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .category-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }

        .category-box a {
            text-decoration: none;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        .category-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .category-box h2 {
            font-size: 16px;
            font-weight: 600;
            margin: 10px 0 0 0;
            text-align: center;
        }
        /* ---------------------------------- */

        .search-box {
            text-align: center;
            margin: 20px;
        }

        .search-box input {
            padding: 9px 12px;
            width: 260px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .search-box button {
            padding: 9px 16px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .search-box button:hover {
            background: #0056b3;
        }

        .news-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }

        .news-box {
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .news-box:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .news-box h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .news-box p {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .news-box a {
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>World in Live</h1>

    <!-- Category Boxes -->
    <div class="categories">
        <div class="category-box">
            <a href="/category/Business">
                <img src="https://png.pngtree.com/background/20250116/original/pngtree-stock-market-analysis-with-colorful-candlestick-chart-picture-image_16020049.jpg" alt="Business" class="category-img">
                <h2>Business</h2>
            </a>
        </div>

        <div class="category-box">
            <a href="/category/World">
                <img src="https://img.magnific.com/free-vector/global-technology-earth-news-bulletin-background_1017-33687.jpg?semt=ais_hybrid&w=740&q=80" alt="World" class="category-img">
                <h2>World</h2>
            </a>
        </div>

        <div class="category-box">
            <a href="/category/Sports">
                <img src="https://t3.ftcdn.net/jpg/02/87/04/00/360_F_287040077_U2ckmhpzeyqDHiybj0dfCfX6NRCEKdoe.jpg" alt="Sports" class="category-img">
                <h2>Sports</h2>
            </a>
        </div>

        <div class="category-box">
            <a href="/category/Technology">
                <img src="https://images.moneycontrol.com/static-mcnews/2022/04/shutterstock_767487700-1.png?impolicy=website&width=1600&height=900" alt="Technology" class="category-img">
                <h2>Technology</h2>
            </a>
        </div>
    </div>

    <!-- Search Box -->
    <div class="search-box">
        <form action="/search" method="get">
            <input type="text" name="keyword" placeholder="Search headlines..." value="{{ keyword }}">
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- News Section -->
    <div class="news">
        {% if category %}
            <h2 style="text-align:center; color:darkgreen;">{{ category }} News</h2>
        {% elif keyword %}
            <h2 style="text-align:center; color:darkblue;">Search Results for "{{ keyword }}"</h2>
        {% else %}
            <h2 style="text-align:center; color:darkred;">Latest News</h2>
        {% endif %}

        <div class="news-container">
            {% for h in headlines %}
            <div class="news-box">
                <h3>{{ h.title }}</h3>
                <p><strong>{{ h.source }}</strong> | {{ h.published }}</p>
                <a href="{{ h.link }}" target="_blank">Read more</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
